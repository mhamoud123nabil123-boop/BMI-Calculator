<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BMI Calculator</title>
</head>
<body>
    <div class="container">
        <h1>Body Mass Index (BMI) Calculator</h1>
        Your Height (cm):
        <input type="number" class="input" id="height" placeholder="Your Height (cm):">
        Your Weight (Kg):
        <input type="number" class="input" id="weight" placeholder="Your Weight (Kg):">
        <button class="btn" id="btn">Compute BMI</button>
        <input type="text" disabled class="input" id="bmi">
        <h4>Weight Condation: <span id="Condation"></span></h4>
    </div>
    <script src="main.js"></script>
</body>
</html>
